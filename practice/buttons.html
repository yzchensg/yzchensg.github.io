<style>
.whatsapp-button {
   background-color: rgb(0, 128, 10);
   text-align: center;
   color: white;
   height: 30px;
   width: 100px;
   border-radius: 7px; /* rounded corners */
   padding-top: 5px; /* vertical padding */
   cursor: pointer; /* pointer cursor */
   transition: opacity 0.3s ease; /* smooth transition for opacity */
   /* only applies to hovering*/ 
}

.whatsapp-button:hover {
   opacity: 0.8;
} /* changes color when hovered */

.whatsapp-button:active {
  background-color: rgb(0, 100, 0);
} /* changes color when clicked */

.facebook-button {
   background-color: rgb(59, 89, 152);
   text-align: center;
   color: white;
   height: 30px;
   width: 100px;
   border-radius: 7px;
   cursor: pointer; /* pointer cursor */
   transition: opacity 0.3s ease; /* smooth transition for opacity */
}

.facebook-button:hover {
   box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.2); /* adds shadow on hover */
} /* changes color when hovered */
</style>

<button class="whatsapp-button">
  WhatsApp
</button>

<button class="facebook-button">
  Facebook
</button>
